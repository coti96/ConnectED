
services:
  #  Neo4j
  db:
    image: neo4j:community
    container_name: connected-db
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-connected_password}
    ports:
      - "7474:7474" # Interface web Neo4j
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - ./database/csv:/var/lib/neo4j/import
      - ./database/init:/scripts
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-connected_password} 'RETURN 1'" ]
      interval: 10s
      timeout: 10s
      retries: 5

  db-init:
    image: neo4j:community
    container_name: connected-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/init:/scripts
      - ./database/csv:/var/lib/neo4j/import
    entrypoint: >
      /bin/bash -c " set -e; echo '=== INITIALISATION DE LA BASE ==='; cypher-shell -a bolt://db:7687 -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-connected_password} -f /scripts/db_init.cypher; echo '=== TERMINÉ ==='; "

  # Backend
  backend:
    build: ./backend
    container_name: connected-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - NEO4J_URI=bolt://db:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-connected_password}
      - DB_URI=bolt://db:7687
      - DB_USER=${NEO4J_USER:-neo4j}
      - DB_PASSWORD=${NEO4J_PASSWORD:-connected_password}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-this-is-a-very-long-and-secure-secret-key-for-connected-2026-esiee}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
    command: python -m flask run --host=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: connected-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    restart: always

volumes:
  neo4j_data:
