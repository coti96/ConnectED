services:
  db:
    image: neo4j:community
    container_name: connected-db
    restart: always
    environment:
      NEO4J_AUTH: neo4j/connected_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p connected_password 'RETURN 1'" ]
      interval: 10s
      timeout: 10s
      retries: 5
  db-init:
    image: neo4j:community
    container_name: connected-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/init:/scripts
    entrypoint: >
      /bin/bash -c " echo 'Injection des fixtures...'; cypher-shell -a bolt://db:7687 -u neo4j -p connected_password -f /scripts/db.cypher; echo 'Terminé !'; "
  backend:
    build: ./backend
    container_name: connected-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - NEO4J_URI=bolt://db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=connected_password
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    command: python -m flask run --host=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    restart: always
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: connected-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    restart: always

volumes:
  neo4j_data:
