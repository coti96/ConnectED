services:
  backend:
    build: ./backend
    container_name: connected-backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: connected
      DB_USER: connected_user
      DB_PASSWORD: connected_password

  frontend:
    image: nginx:alpine
    container_name: connected-frontend
    ports:
      - "4200:80"

  db:
    image: mariadb:11
    container_name: connected-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: connected
      MARIADB_USER: connected_user
      MARIADB_PASSWORD: connected_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

volumes:
  db_data:
