<section class="profile-container">
  <div class="profile-card">
    <div class="header">
      <h2>Créer un nouveau projet</h2>
      <button routerLink="/projects" class="btn-edit">
        Retour
      </button>
    </div>

    <div *ngIf="message" class="message error">
      {{ message }}
    </div>

    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
      
      <div class="section">
        <h3>Détails du projet</h3>
        
        <div class="form-group">
          <label>Titre du projet</label>
          <input type="text" formControlName="titre" placeholder="Ex: Application mobile de covoiturage" />
        </div>

        <div class="form-group">
          <label>Description complète</label>
          <textarea formControlName="description" rows="5" placeholder="Décrivez le but du projet, les défis..."></textarea>
        </div>

        <div class="row">
          <div class="form-group">
            <label>Domaine</label>
            <input type="text" formControlName="domaine" placeholder="Ex: Développement Web, IA, Data..." />
          </div>
          
          <div class="form-group">
            <label>Nombre de places</label>
            <input type="number" formControlName="nombre_places" min="1" />
          </div>
        </div>

        <div class="form-group">
          <label>Date limite (Deadline)</label>
          <input type="date" formControlName="deadline" />
        </div>
      </div>

      <!-- Compétences (Tags) -->
      <div class="section">
        <h3>Technologies requises</h3>
        <p class="subtitle">Ajoutez les technos que vous recherchez (Appuyez sur Entrée)</p>
        
        <div class="tags-input">
          <input 
            type="text" 
            placeholder="Ajouter une techno (ex: React) + Entrée" 
            (keydown.enter)="addTech($event); $event.preventDefault()"
          />
        </div>
        
        <div class="tags-list">
          <span *ngFor="let tech of technologies" class="tag">
            {{ tech }}
            <span class="remove" (click)="removeTech(tech)">×</span>
          </span>
          <span *ngIf="technologies.length === 0" class="no-tags">Aucune technologie ajoutée</span>
        </div>
      </div>

      <button type="submit" class="btn-save" [disabled]="projectForm.invalid">
        Publier le projet
      </button>

    </form>
  </div>
</section>
