<section class="profile-container">
  <div class="profile-card">
    <div class="header">
      <h2>Mon Profil</h2>
      <button (click)="toggleEdit()" class="btn-edit">
        {{ isEditing ? 'Annuler' : 'Modifier' }}
      </button>
    </div>

    <div *ngIf="message" class="message success">
      {{ message }}
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      
      <!-- Infos de base -->
      <div class="section">
        <h3>Informations personnelles</h3>
        <div class="row">
          <div class="form-group">
            <label>Nom</label>
            <input type="text" formControlName="nom" />
          </div>
          <div class="form-group">
            <label>Prénom</label>
            <input type="text" formControlName="prenom" />
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" />
        </div>

        <div class="form-group">
          <label>Ville</label>
          <input type="text" formControlName="ville" placeholder="Ex: Paris" />
        </div>

        <div class="form-group">
          <label>Bio courte</label>
          <textarea formControlName="bio_courte" rows="3" placeholder="Parlez de vous en quelques mots..."></textarea>
        </div>
      </div>

      <!-- Infos spécifiques Étudiant -->
      <div class="section" *ngIf="userRole === 'etudiant'">
        <h3>Scolarité</h3>
        <div class="row">
          <div class="form-group">
            <label>École</label>
            <input type="text" formControlName="ecole" />
          </div>
          <div class="form-group">
            <label>Filière</label>
            <input type="text" formControlName="filiere" />
          </div>
        </div>
      </div>

      <!-- Infos spécifiques Pro -->
      <div class="section" *ngIf="userRole === 'professionnel'">
        <h3>Situation professionnelle</h3>
        <div class="row">
          <div class="form-group">
            <label>Entreprise</label>
            <input type="text" formControlName="entreprise" />
          </div>
          <div class="form-group">
            <label>Fonction</label>
            <input type="text" formControlName="fonction" />
          </div>
        </div>
      </div>

      <!-- Compétences (Tags) -->
      <div class="section">
        <h3>Mes Compétences & Technos</h3>
        <div class="tags-input" *ngIf="isEditing">
          <input 
            type="text" 
            placeholder="Ajouter une techno (ex: Python) + Entrée" 
            (keydown.enter)="addTech($event); $event.preventDefault()"
          />
        </div>
        
        <div class="tags-list">
          <span *ngFor="let tech of technologies" class="tag">
            {{ tech }}
            <span *ngIf="isEditing" class="remove" (click)="removeTech(tech)">×</span>
          </span>
          <span *ngIf="technologies.length === 0" class="no-tags">Aucune compétence ajoutée</span>
        </div>
      </div>

      <button *ngIf="isEditing" type="submit" class="btn-save" [disabled]="profileForm.invalid">
        Enregistrer les modifications
      </button>

    </form>
  </div>
</section>
