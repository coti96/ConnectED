<section class="profile-container">
  <div class="profile-card">
    <div class="header">
      <h2>Mon Profil</h2>
      <button (click)="toggleEdit()" class="btn-edit">
        {{ isEditing ? 'Annuler' : 'Modifier' }}
      </button>
    </div>

    <div *ngIf="message" class="message success">
      {{ message }}
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      
      <!-- Infos de base -->
      <div class="section">
        <h3>Informations personnelles</h3>
        <div class="row">
          <div class="form-group">
            <label>Nom</label>
            <input type="text" formControlName="nom" />
          </div>
          <div class="form-group">
            <label>Prénom</label>
            <input type="text" formControlName="prenom" />
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" />
        </div>

        <div class="form-group">
          <label>Ville</label>
          <input type="text" formControlName="ville" placeholder="Ex: Paris" />
        </div>

        <div class="form-group">
          <label>Bio courte</label>
          <textarea formControlName="bio_courte" rows="3" placeholder="Parlez de vous en quelques mots..."></textarea>
        </div>
      </div>

      <!-- Infos spécifiques Étudiant -->
      <div class="section" *ngIf="userRole === 'etudiant'">
        <h3>Scolarité</h3>
        <div class="row">
          <div class="form-group">
            <label>École</label>
            <input type="text" formControlName="ecole" placeholder="Ex: ESIEE Paris" />
          </div>
          <div class="form-group">
            <label>Filière</label>
            <input type="text" formControlName="filiere" placeholder="Ex: Informatique" />
          </div>
        </div>
      </div>

      <!-- Infos spécifiques Pro -->
      <div class="section" *ngIf="userRole === 'professionnel'">
        <h3>Situation professionnelle</h3>
        <div class="row">
          <div class="form-group">
            <label>Entreprise</label>
            <input type="text" formControlName="entreprise" />
          </div>
          <div class="form-group">
            <label>Fonction</label>
            <input type="text" formControlName="fonction" />
          </div>
        </div>
      </div>

      <!-- Compétences (Tags) -->
      <div class="section">
        <h3>Mes Compétences & Technos</h3>
        <p class="hint" *ngIf="isEditing">Appuyez sur Entrée pour ajouter une compétence.</p>
        
        <div class="tags-input-container" *ngIf="isEditing">
          <input 
            #techInput
            type="text" 
            placeholder="Ajouter une techno (ex: Python)..." 
            (keydown.enter)="addTech($event); $event.preventDefault()"
          />
        </div>
        
        <div class="tags-list">
          <span *ngFor="let tech of technologies" class="tag">
            {{ tech }}
            <button *ngIf="isEditing" type="button" class="remove-btn" (click)="removeTech(tech)">×</button>
          </span>
          <span *ngIf="technologies.length === 0" class="no-tags">Aucune compétence ajoutée</span>
        </div>
      </div>

      <div class="section">
        <h3>Liens & Disponibilité</h3>
        <div class="row">
          <div class="form-group">
            <label>GitHub</label>
            <input type="text" formControlName="github_url" placeholder="https://github.com/..." />
          </div>
          <div class="form-group">
            <label>LinkedIn</label>
            <input type="text" formControlName="linkedin_url" placeholder="https://linkedin.com/in/..." />
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Portfolio</label>
            <input type="text" formControlName="portfolio_url" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label>Disponibilité</label>
            <input type="text" formControlName="availability" placeholder="Ex: 5h/semaine" />
          </div>
        </div>
      </div>

      <div class="section" *ngIf="isEditing">
        <h3>Sécurité</h3>
        <div *ngIf="passwordMessage" class="message success">{{ passwordMessage }}</div>
        <div class="row">
          <div class="form-group">
            <label>Mot de passe actuel</label>
            <input type="password" [(ngModel)]="currentPassword" [ngModelOptions]="{standalone: true}" />
          </div>
          <div class="form-group">
            <label>Nouveau mot de passe</label>
            <input type="password" [(ngModel)]="newPassword" [ngModelOptions]="{standalone: true}" />
          </div>
        </div>
        <button type="button" class="btn-save" (click)="updatePassword()">Changer le mot de passe</button>
      </div>

      <div class="actions" *ngIf="isEditing">
        <button type="submit" class="btn-save" [disabled]="profileForm.invalid">
          Enregistrer les modifications
        </button>
      </div>
    </form>
  </div>
</section>
