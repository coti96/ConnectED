<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Connexion</h2>
      <p>Bienvenue sur ConnectED</p>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      <span class="icon"><app-icon name="warning" [size]="18"></app-icon></span> {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <input type="email" formControlName="email" placeholder="votre@email.com" />
          <span class="input-icon"><app-icon name="mail" [size]="18"></app-icon></span>
        </div>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-wrapper">
          <input type="password" formControlName="password" placeholder="••••••••" />
          <span class="input-icon"><app-icon name="lock" [size]="18"></app-icon></span>
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">
        Se connecter
      </button>

      <div class="auth-footer">
        Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
      </div>
    </form>
  </div>
</div>
