<header class="nav">
  <div class="logo">
    <a routerLink="/">ConnectED</a>
  </div>

  <nav class="links">
    <a routerLink="/projects">Projets</a>
    <!-- On enlève le lien À propos qui cause l'erreur -->
    <!-- <a routerLink="/about">À propos</a> -->
  </nav>

  <div class="actions">
    <button *ngIf="!auth.isLoggedIn()" routerLink="/login" class="btn-login">
      Se connecter
    </button>

    <div *ngIf="auth.isLoggedIn()" class="user-actions">
      <!-- LIENS GÉNÉRAUX -->
      <a routerLink="/messages" class="profile-link">💬 Messages</a>
      
      <!-- LIENS ÉTUDIANTS -->
      <a *ngIf="auth.currentUser()?.role === 'student'" routerLink="/projects/my-applications" class="profile-link">
        📋 Mes Candidatures
      </a>

      <!-- LIENS CRÉATEURS / PROS -->
      <a *ngIf="auth.currentUser()?.role === 'creator' || auth.currentUser()?.role === 'professional'" routerLink="/projects/manage" class="profile-link">
        🛠️ Gérer mes projets
      </a>

      <a routerLink="/profile" class="profile-link">👤 Mon Profil</a>
      
      <button (click)="auth.logout()" class="btn-login logout">
        Déconnexion
      </button>
    </div>
  </div>
</header>
